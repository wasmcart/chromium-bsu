name: Build wasmcart cart

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # Pinned: emscripten changes codegen between versions, and a game that built
  # last month should still build today.
  EMSDK_VERSION: 4.0.3

jobs:
  build-wasc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Installed directly from upstream rather than via a third-party action.
      # mymindstorm/setup-emsdk@v14 targets Node 20, which GitHub deprecated, so
      # every run printed a deprecation warning -- and a warning nobody can fix
      # from here trains people to ignore warnings. This is a git clone and one
      # script; it has no such dependency, and it pins the emsdk version.
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          cd ~/emsdk
          ./emsdk install ${{ env.EMSDK_VERSION }}
          ./emsdk activate ${{ env.EMSDK_VERSION }}
          # Put emcc/em++ on PATH for every later step in this job.
          . ./emsdk_env.sh
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
          echo "$EMSDK" >> "$GITHUB_PATH"

      - name: Show Emscripten version
        run: emcc --version | head -1

      - name: Build
        run: |
          chmod +x build.sh pack.sh
          bash build.sh

      - name: Pack
        run: bash pack.sh

      - name: Upload .wasc artifact
        uses: actions/upload-artifact@v7
        with:
          name: chromium_bsu
          path: build/chromium_bsu.wasc

  release:
    needs: build-wasc
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Chromium B.S.U. ${{ github.ref_name }}"
          body: |
            Chromium B.S.U. wasmcart cart (.wasc).

            Runs on all wasmcart hosts: browser, Node.js, wasmcart-native, and RetroArch.
            ES 3.0 renderer — no GL translation layers needed.
          files: artifacts/chromium_bsu/*.wasc
